<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
			<!--for a responsive page on mobile devices-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
		<!--title appears on browser tab and in Google searh results--> 
    <title>Get Involved - Saved Dreams Foundation</title>
   
</head>
<body>
<!-- website header-->
    <header>
	<!--navigation bar-->
        <nav>
		<!--logo-->
		<div class="logo">
            <img src="images/logo.jpg" style="width: 150px; height: auto" alt="Saved Dreams Foundation Logo">
        </div>
            <a href="index.html">Home</a>
                <a href="about.html">About Us</a>
                <a href="program.html">Programs & Services</a>
                <a href="enquiry.html">Get Involved</a>
                <a href="contacts.html">Contact Us</a>
        </nav>
    </header>
 <!--main content of the page-->
    <main>
        <h1>Volunteer & Sponsorship Enquiry</h1>
		<!--form for sponsor,volunteer, or general enquiry-->
        <form action="#" method="post">
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" required>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required>

            <label for="type">I want to:</label>
			<!--selection tag for multible list-->
            <select id="type" name="type">
                <option value="volunteer">Become a Volunteer</option>
                <option value="sponsor">Become a Sponsor</option>
                <option value="general">General Enquiry</option>
            </select>

            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="5" required></textarea>
<!--submit button for the form-->
            <button type="submit">Submit Enquiry</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Saved Dreams Foundation. All Rights Reserved.</p>
    </footer>
</body>
</html>
