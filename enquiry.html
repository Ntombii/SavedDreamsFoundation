<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
			<!--for a responsive page on mobile devices-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
		<!--title appears on browser tab and in Google searh results--> 
    <title>Get Involved - Saved Dreams Foundation</title>
    <link rel="stylesheet" href="style.css">
   
</head>
<body class="enquiry-page">
<!-- =========================================
     WEBSITE HEADER
========================================= -->

<div class="topbar">
    Building resilient learners • Empowered educators • Stronger communities
</div>

<header class="header">

    <div class="header-container">

        <!-- Logo -->
        <a href="index.html" class="logo">
            <img
                src="images/logo.jpg"
                alt="Saved Dreams Foundation Logo"
            >
        </a>


        <!-- Navigation -->
        <nav class="nav-menu" id="navMenu">

            <a href="index.html">Home</a>

            <a href="about.html" >
                About Us
            </a>

            <a href="program.html">
                Programs &amp; Services
            </a>

            <a href="enquiry.html" class="active">
                Get Involved
            </a>

            <a href="contacts.html">
                Contact Us
            </a>

        </nav>


        <!-- Mobile menu button -->
        <button
            class="menu-btn"
            id="menuBtn"
            aria-label="Open navigation"
        >
            ☰
        </button>

    </div>

</header>
 <!--main content of the page-->
    <main class="enquiry-main">
        <h1>Volunteer & Sponsorship Enquiry</h1>
		<!--form for sponsor,volunteer, or general enquiry-->
        <form id="enquiryForm" class="enquiry-form" action="#" method="post">
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" required>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required>

            <label for="type">I want to:</label>
			<!--selection tag for multible list-->
            <select id="type" name="type">
                <option value="volunteer">Become a Volunteer</option>
                <option value="sponsor">Become a Sponsor</option>
                <option value="general">General Enquiry</option>
            </select>

            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="5" required></textarea>
<!--submit button for the form-->
            <button type="submit">Submit Enquiry</button>
            <p id="formMessage" class="form-message"></p>
        </form>
    </main>
<!--this is the footer-->
    <footer>
        <p>&copy; 2026 Saved Dreams Foundation. All Rights Reserved.</p>
    </footer>

</body>
</html>
